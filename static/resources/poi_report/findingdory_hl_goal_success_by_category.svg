<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">High-level goal success rate by goal category</title>
  <desc id="description">Bar chart showing the percentage of high-level goals successfully completed in each FindingDory goal category.</desc>
  <style>
    .background { fill: #fffdf7; }
    .grid { stroke: #d9d2c3; stroke-width: 1; }
    .axis { stroke: #52606d; stroke-width: 1.5; }
    .bar { fill: #c05621; }
    text { fill: #1f2933; font-family: ui-sans-serif, system-ui, sans-serif; }
    .tick, .count { font-size: 14px; fill: #52606d; }
    .value { font-size: 14px; font-weight: 700; }
    .category { font-size: 13px; }
    .axis-label { font-size: 16px; font-weight: 700; }
    .chart-title { font-size: 24px; font-weight: 700; }
  </style>
  <rect width="100%" height="100%" class="background" />
  <text x="640.0" y="34" class="chart-title" text-anchor="middle">High-Level Goal Success Rate by Goal Category</text>
  <line x1="90" y1="510.0" x2="1250" y2="510.0" class="grid" /><text x="76" y="515.0" class="tick" text-anchor="end">0%</text><line x1="90" y1="422.0" x2="1250" y2="422.0" class="grid" /><text x="76" y="427.0" class="tick" text-anchor="end">20%</text><line x1="90" y1="334.0" x2="1250" y2="334.0" class="grid" /><text x="76" y="339.0" class="tick" text-anchor="end">40%</text><line x1="90" y1="246.0" x2="1250" y2="246.0" class="grid" /><text x="76" y="251.0" class="tick" text-anchor="end">60%</text><line x1="90" y1="158.0" x2="1250" y2="158.0" class="grid" /><text x="76" y="163.0" class="tick" text-anchor="end">80%</text><line x1="90" y1="70.0" x2="1250" y2="70.0" class="grid" /><text x="76" y="75.0" class="tick" text-anchor="end">100%</text>
  <line x1="90" y1="70" x2="90" y2="510" class="axis" />
  <line x1="90" y1="510" x2="1250" y2="510" class="axis" />
  <g><title>Object Recall: 78.6% (11/14)</title><rect x="110.7" y="164.3" width="64.0" height="345.7" rx="6" class="bar" /><text x="142.7" y="154.3" class="value" text-anchor="middle">78.6%</text><text x="142.7" y="538.0" class="count" text-anchor="middle">11/14</text><text x="142.7" y="570.0" class="category" text-anchor="middle"><tspan x="142.7" dy="0">Object</tspan><tspan x="142.7" dy="18">Recall</tspan></text></g><g><title>Interaction: 71.1% (27/38)</title><rect x="216.2" y="197.4" width="64.0" height="312.6" rx="6" class="bar" /><text x="248.2" y="187.4" class="value" text-anchor="middle">71.1%</text><text x="248.2" y="538.0" class="count" text-anchor="middle">27/38</text><text x="248.2" y="570.0" class="category" text-anchor="middle"><tspan x="248.2" dy="0">Interaction</tspan></text></g><g><title>Conditional Interaction: 52.2% (24/46)</title><rect x="321.6" y="280.4" width="64.0" height="229.6" rx="6" class="bar" /><text x="353.6" y="270.4" class="value" text-anchor="middle">52.2%</text><text x="353.6" y="538.0" class="count" text-anchor="middle">24/46</text><text x="353.6" y="570.0" class="category" text-anchor="middle"><tspan x="353.6" dy="0">Conditional</tspan><tspan x="353.6" dy="18">Interaction</tspan></text></g><g><title>Object Attributes: 52.0% (13/25)</title><rect x="427.1" y="281.2" width="64.0" height="228.8" rx="6" class="bar" /><text x="459.1" y="271.2" class="value" text-anchor="middle">52.0%</text><text x="459.1" y="538.0" class="count" text-anchor="middle">13/25</text><text x="459.1" y="570.0" class="category" text-anchor="middle"><tspan x="459.1" dy="0">Object</tspan><tspan x="459.1" dy="18">Attributes</tspan></text></g><g><title>Spatial Relationship: 26.7% (8/30)</title><rect x="532.5" y="392.7" width="64.0" height="117.3" rx="6" class="bar" /><text x="564.5" y="382.7" class="value" text-anchor="middle">26.7%</text><text x="564.5" y="538.0" class="count" text-anchor="middle">8/30</text><text x="564.5" y="570.0" class="category" text-anchor="middle"><tspan x="564.5" dy="0">Spatial</tspan><tspan x="564.5" dy="18">Relationship</tspan></text></g><g><title>Room Visitation: 62.5% (15/24)</title><rect x="638.0" y="235.0" width="64.0" height="275.0" rx="6" class="bar" /><text x="670.0" y="225.0" class="value" text-anchor="middle">62.5%</text><text x="670.0" y="538.0" class="count" text-anchor="middle">15/24</text><text x="670.0" y="570.0" class="category" text-anchor="middle"><tspan x="670.0" dy="0">Room</tspan><tspan x="670.0" dy="18">Visitation</tspan></text></g><g><title>Interaction Order: 16.0% (12/75)</title><rect x="743.5" y="439.6" width="64.0" height="70.4" rx="6" class="bar" /><text x="775.5" y="429.6" class="value" text-anchor="middle">16.0%</text><text x="775.5" y="538.0" class="count" text-anchor="middle">12/75</text><text x="775.5" y="570.0" class="category" text-anchor="middle"><tspan x="775.5" dy="0">Interaction</tspan><tspan x="775.5" dy="18">Order</tspan></text></g><g><title>Time-Based: 66.7% (8/12)</title><rect x="848.9" y="216.7" width="64.0" height="293.3" rx="6" class="bar" /><text x="880.9" y="206.7" class="value" text-anchor="middle">66.7%</text><text x="880.9" y="538.0" class="count" text-anchor="middle">8/12</text><text x="880.9" y="570.0" class="category" text-anchor="middle"><tspan x="880.9" dy="0">Time-Based</tspan></text></g><g><title>Duration Tracking: 40.0% (6/15)</title><rect x="954.4" y="334.0" width="64.0" height="176.0" rx="6" class="bar" /><text x="986.4" y="324.0" class="value" text-anchor="middle">40.0%</text><text x="986.4" y="538.0" class="count" text-anchor="middle">6/15</text><text x="986.4" y="570.0" class="category" text-anchor="middle"><tspan x="986.4" dy="0">Duration</tspan><tspan x="986.4" dy="18">Tracking</tspan></text></g><g><title>Unordered Revisitation: 40.0% (16/40)</title><rect x="1059.8" y="334.0" width="64.0" height="176.0" rx="6" class="bar" /><text x="1091.8" y="324.0" class="value" text-anchor="middle">40.0%</text><text x="1091.8" y="538.0" class="count" text-anchor="middle">16/40</text><text x="1091.8" y="570.0" class="category" text-anchor="middle"><tspan x="1091.8" dy="0">Unordered</tspan><tspan x="1091.8" dy="18">Revisitation</tspan></text></g><g><title>Ordered Revisitation: 5.6% (1/18)</title><rect x="1165.3" y="485.6" width="64.0" height="24.4" rx="6" class="bar" /><text x="1197.3" y="475.6" class="value" text-anchor="middle">5.6%</text><text x="1197.3" y="538.0" class="count" text-anchor="middle">1/18</text><text x="1197.3" y="570.0" class="category" text-anchor="middle"><tspan x="1197.3" dy="0">Ordered</tspan><tspan x="1197.3" dy="18">Revisitation</tspan></text></g>
  <text x="25" y="290.0" class="axis-label" text-anchor="middle" transform="rotate(-90 25 290.0)">HL Goal Success Rate</text>
  <text x="670.0" y="696" class="axis-label" text-anchor="middle">Goal Category</text>
</svg>
