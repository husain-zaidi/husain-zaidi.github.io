<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title description">
  <title id="title">All-Task High-Level Goal Success Rate by Model</title>
  <desc id="description">Bar chart comparing the paper baselines with Qwen3-VL plus POI on All Tasks. The dashed line is the 95.92 percent oracle upper bound.</desc>
  <style>
    .background { fill: #fffdf7; } .grid { stroke: #d9d2c3; stroke-width: 1; } .axis { stroke: #52606d; stroke-width: 1.5; } .oracle { stroke: #0f766e; stroke-width: 2.2; stroke-dasharray: 8 6; } text { fill: #1f2933; font-family: ui-sans-serif, system-ui, sans-serif; } .tick { font-size: 15px; fill: #52606d; } .value { font-size: 16px; font-weight: 700; } .model { font-size: 15px; } .axis-label { font-size: 17px; font-weight: 700; } .chart-title { font-size: 28px; font-weight: 700; } .subtitle, .note { font-size: 14px; fill: #52606d; }
  </style>
  <rect width="100%" height="100%" class="background"/>
  <text x="105" y="44" class="chart-title">All-Task High-Level Goal Success Rate by Model</text>
  <text x="105" y="71" class="subtitle">FindingDory paper baselines (Table 4) plus the current Qwen3-VL + POI evaluation</text>
  <line x1="105" y1="575.0" x2="1385" y2="575.0" class="grid"/><text x="89" y="580.0" class="tick" text-anchor="end">0%</text><line x1="105" y1="484.0" x2="1385" y2="484.0" class="grid"/><text x="89" y="489.0" class="tick" text-anchor="end">20%</text><line x1="105" y1="393.0" x2="1385" y2="393.0" class="grid"/><text x="89" y="398.0" class="tick" text-anchor="end">40%</text><line x1="105" y1="302.0" x2="1385" y2="302.0" class="grid"/><text x="89" y="307.0" class="tick" text-anchor="end">60%</text><line x1="105" y1="211.0" x2="1385" y2="211.0" class="grid"/><text x="89" y="216.0" class="tick" text-anchor="end">80%</text><line x1="105" y1="120.0" x2="1385" y2="120.0" class="grid"/><text x="89" y="125.0" class="tick" text-anchor="end">100%</text>
  <line x1="105" y1="120" x2="105" y2="575" class="axis"/>
  <line x1="105" y1="575" x2="1385" y2="575" class="axis"/>
  <line x1="105" y1="138.6" x2="1385" y2="138.6" class="oracle"/>
  <rect x="1161" y="113.6" width="218" height="22" rx="4" fill="#fffdf7"/>
