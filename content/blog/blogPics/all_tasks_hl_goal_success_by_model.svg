"602.0" class="model" text-anchor="end" transform="rotate(-32 1145.0 602.0)">Qwen SFT</text></g><g><title>Qwen3-VL + POI: 40.90%</title><rect x="1255.4" y="388.9" width="99.2" height="186.1" rx="6" fill="#c05621"/><text x="1305.0" y="377.9" class="value" text-anchor="middle">40.9%</text><text x="1305.0" y="602.0" class="model" text-anchor="end" transform="rotate(-32 1305.0 602.0)">Qwen3-VL + POI</text></g>
